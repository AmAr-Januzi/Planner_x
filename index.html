<!DOCTYPE html>
<html lang="en" class="preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6C4CF1">
  <meta name="description" content="Plan your day from wake-up to bedtime, with a coach, focus timer and points. Your data stays in your browser.">
  <title>Planner </title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- order matters: later files override earlier ones, responsive.css must stay last -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/day.css">
  <link rel="stylesheet" href="css/widgets.css">
  <link rel="stylesheet" href="css/timeline.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/stats.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- apply the collapsed sidebar before the first paint, so it doesn't jump open then shut -->
  <script>try { if (localStorage.getItem('plannerx-side') === 'mini') document.documentElement.classList.add('side-mini'); } catch (e) {}</script>
</head>
<body>
  <header class="topbar" aria-label="Main menu">
    <div class="brand">
      <span class="logo">X</span>
      <span class="brand-name">Planner X</span>
      <button class="side-toggle" id="sideToggle" data-act="sideToggle" aria-controls="tabs" aria-label="Collapse sidebar">«</button>
    </div>

    <nav class="tabs" id="tabs">
      <button data-act="view" data-view="day"><span class="tab-ic" aria-hidden="true">☀️</span><span class="tab-tx">Day</span></button>
      <button data-act="view" data-view="week"><span class="tab-ic" aria-hidden="true">🗓️</span><span class="tab-tx">Week</span></button>
      <button data-act="view" data-view="month"><span class="tab-ic" aria-hidden="true">📅</span><span class="tab-tx">Month</span></button>
      <button data-act="view" data-view="year"><span class="tab-ic" aria-hidden="true">🌟</span><span class="tab-tx">Year</span></button>
      <button data-act="view" data-view="stats"><span class="tab-ic" aria-hidden="true">📊</span><span class="tab-tx">Stats</span></button>
    </nav>

    <nav class="subnav" id="dayNav" aria-label="Day sections" hidden></nav>

    <div class="level" id="levelBox"></div>
    <div class="side-actions">
      <button class="mode-btn set-btn" id="setBtn" data-act="view" data-view="settings" aria-label="Settings" title="Settings">⚙️</button>
      <button class="mode-btn" id="modeBtn" data-act="mode" aria-label="Switch light / dark mode"></button>
    </div>
  </header>

  <main id="view"></main>

  <div class="modal-bg hidden" id="modal"><div class="modal" id="modalBody" role="dialog" aria-modal="true" aria-label="Planner X dialog" tabindex="-1"></div></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <!-- plain scripts (not modules) so the site also works when index.html is opened directly.
       They share one global scope; main.js starts the app and must stay last. -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/points.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/tooltips.js"></script>
  <script src="js/render.js"></script>
  <script src="js/views/day.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/events.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
